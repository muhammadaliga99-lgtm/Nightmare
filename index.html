<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmare</title>
  <link rel="shortcut icon" href="image.png" type="image/x-icon">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      padding: 16px;
    }
    #timer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(1.1rem, 4vw, 2.5rem);
      font-weight: 700;
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 24px 32px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      width: 100%;
      max-width: 640px;
    }
  </style>
</head>
<body>
  <div id="timer">Yuklanmoqda...</div>

  <script>
    const targetDate = new Date('2026-09-02T09:00:00').getTime();

    const updateTimer = () => {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('timer').innerText = "Vaqt tugadi!";
        return;
      }

      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('timer').innerText = 
        `${String(hours).padStart(2, '0')} soat : ${String(minutes).padStart(2, '0')} minut : ${String(seconds).padStart(2, '0')} sekund`;
    };

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
