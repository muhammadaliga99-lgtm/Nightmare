<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Nightmare</title>
  <link rel="shortcut icon" href="image.png" type="image/x-icon">
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: #fff; margin: 0; }
    #timer { font-size: 2.5rem; font-weight: bold; font-mono: monospace; background: #1e293b; padding: 20px 40px; border-radius: 12px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div id="timer">Yuklanmoqda...</div>

  <script>
    const targetDate = new Date('2026-09-02T09:00:00').getTime();

    const updateTimer = () => {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('timer').innerText = "Vaqt tugadi!";
        return;
      }

      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('timer').innerText = 
        `${String(hours).padStart(2, '0')} soat : ${String(minutes).padStart(2, '0')} minut : ${String(seconds).padStart(2, '0')} sekund`;
    };

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
